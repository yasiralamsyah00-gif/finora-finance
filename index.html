<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Finora - Smart Finance App</title>
  
  <meta name="theme-color" content="#064e3b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Finora">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2910/2910791.png">
  <link rel="manifest" href='data:application/manifest+json,{"name":"Finora Finance","short_name":"Finora","start_url":"/","display":"standalone","background_color":"#064e3b","theme_color":"#064e3b","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/2910/2910791.png","sizes":"512x512","type":"image/png"}]}'>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
          colors: {
            emerald: {
              50: '#f0fdf4', 100: '#dcfce7', 500: '#10b981', 600: '#059669',
              700: '#047857', 800: '#065f46', 900: '#064e3b', 950: '#022c22'
            }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
  </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col lg:flex-row pb-16 lg:pb-0">

  <!-- ================= SIDEBAR ================= -->
  <aside class="w-64 bg-white border-r border-slate-100 flex-col justify-between p-6 shrink-0 hidden lg:flex min-h-screen">
    <div>
      <div class="flex items-center gap-3 mb-8 cursor-pointer" onclick="switchTab('dashboard')">
        <div class="w-10 h-10 rounded-xl bg-emerald-600 flex items-center justify-center text-white shadow-md shadow-emerald-200">
          <i data-lucide="leaf" class="w-6 h-6"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight text-slate-900 leading-none">Finora</h1>
          <p class="text-[10px] text-slate-400 font-medium tracking-wide mt-1">Smart Finance Ecosystem</p>
        </div>
      </div>

      <nav class="space-y-1.5" id="sidebarNav">
        <button onclick="switchTab('dashboard')" id="nav-dashboard" class="nav-item w-full flex items-center gap-3.5 px-4 py-3 rounded-xl bg-emerald-700 text-white font-semibold shadow-sm transition">
          <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
          <span class="text-sm">Dashboard</span>
        </button>
        <button onclick="switchTab('transactions')" id="nav-transactions" class="nav-item w-full flex items-center gap-3.5 px-4 py-3 rounded-xl text-slate-500 hover:text-slate-900 hover:bg-slate-50 font-medium transition">
          <i data-lucide="arrow-left-right" class="w-5 h-5"></i>
          <span class="text-sm">Transactions</span>
        </button>
        <button onclick="switchTab('budgets')" id="nav-budgets" class="nav-item w-full flex items-center gap-3.5 px-4 py-3 rounded-xl text-slate-500 hover:text-slate-900 hover:bg-slate-50 font-medium transition">
          <i data-lucide="pie-chart" class="w-5 h-5"></i>
          <span class="text-sm">Budgets (RAB)</span>
        </button>
        <button onclick="switchTab('goals')" id="nav-goals" class="nav-item w-full flex items-center gap-3.5 px-4 py-3 rounded-xl text-slate-500 hover:text-slate-900 hover:bg-slate-50 font-medium transition">
          <i data-lucide="target" class="w-5 h-5"></i>
          <span class="text-sm">Saving Goals</span>
        </button>
        <button onclick="switchTab('debts')" id="nav-debts" class="nav-item w-full flex items-center gap-3.5 px-4 py-3 rounded-xl text-slate-500 hover:text-slate-900 hover:bg-slate-50 font-medium transition">
          <i data-lucide="hand-coins" class="w-5 h-5"></i>
          <span class="text-sm">Utang & Piutang</span>
        </button>
        <button onclick="switchTab('reports')" id="nav-reports" class="nav-item w-full flex items-center gap-3.5 px-4 py-3 rounded-xl text-slate-500 hover:text-slate-900 hover:bg-slate-50 font-medium transition">
          <i data-lucide="file-text" class="w-5 h-5"></i>
          <span class="text-sm">Reports</span>
        </button>
      </nav>
    </div>

    <div class="bg-gradient-to-br from-emerald-50 to-teal-50 border border-emerald-100 rounded-2xl p-4 text-center relative">
      <div class="w-10 h-10 rounded-full bg-emerald-100 text-emerald-700 flex items-center justify-center mx-auto mb-2">
        <i data-lucide="sprout" class="w-5 h-5"></i>
      </div>
      <h3 class="text-xs font-bold text-slate-900">Small steps<br>build big wealth</h3>
      <p class="text-[10px] text-slate-500 mt-1 mb-3">Track. Save. Grow.</p>
      <button onclick="switchTab('goals')" class="w-full py-2 bg-emerald-800 text-white text-[11px] font-semibold rounded-xl hover:bg-emerald-900 transition shadow-sm">
        Kelola Celengan &rarr;
      </button>
    </div>
  </aside>

  <!-- ================= BOTTOM NAVIGATION (MOBILE) ================= -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-md border-t border-slate-200 px-4 py-2 flex justify-between items-center z-40 lg:hidden shadow-lg">
    <button onclick="switchTab('dashboard')" class="flex flex-col items-center gap-0.5 text-[10px] font-semibold text-emerald-700">
      <i data-lucide="layout-dashboard" class="w-4 h-4"></i> Dash
    </button>
    <button onclick="switchTab('transactions')" class="flex flex-col items-center gap-0.5 text-[10px] font-medium text-slate-500">
      <i data-lucide="arrow-left-right" class="w-4 h-4"></i> Transaksi
    </button>
    <button onclick="openModal('addModal')" class="-mt-4 w-11 h-11 rounded-full bg-emerald-600 text-white flex items-center justify-center shadow-lg shadow-emerald-500/40">
      <i data-lucide="plus" class="w-5 h-5"></i>
    </button>
    <button onclick="switchTab('budgets')" class="flex flex-col items-center gap-0.5 text-[10px] font-medium text-slate-500">
      <i data-lucide="pie-chart" class="w-4 h-4"></i> RAB
    </button>
    <button onclick="switchTab('debts')" class="flex flex-col items-center gap-0.5 text-[10px] font-medium text-slate-500">
      <i data-lucide="hand-coins" class="w-4 h-4"></i> Utang
    </button>
  </nav>
